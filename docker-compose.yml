version: "3.8"

# ==============================================================================
# WatchParty - Complete Local & Production Container Stack
# Services: App Node.js Server, PostgreSQL, Redis, Mail Catcher (Mailpit)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. WatchParty Real-Time Application Server
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchparty-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - BASE_URL=http://localhost:3001
      - NODE_ID=node_container_1
      - DATA_DIR=/data
      - DATABASE_URL=postgresql://watchparty:watchparty_secret@postgres:5432/watchparty_db
      - REDIS_URL=""
      - MAILER_PROVIDER=console
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - JWT_SECRET=watchparty_production_jwt_secret_key_minimum_32_chars_long
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3001
      - MEDIA_PROVIDER=livekit
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - COTURN_URL=turn:coturn:3478?transport=udp
      - COTURN_SECRET=watchparty_coturn_secret
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. Redis - In-Memory State Store, Snapshots & Cluster Pub/Sub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: watchparty-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. PostgreSQL - Relational Database for Accounts, Social & Preferences
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: watchparty-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=watchparty
      - POSTGRES_PASSWORD=watchparty_secret
      - POSTGRES_DB=watchparty_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchparty -d watchparty_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. Mail Catcher (Mailpit) - Zero-setup Local SMTP Catcher & Web Inspector
  # ----------------------------------------------------------------------------
  mailcatcher:
    image: axllent/mailpit:latest
    container_name: watchparty-mailcatcher
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Modern Web UI inbox
    environment:
      - MP_DATA_FILE=/data/mailpit.db
      - MP_MAX_MESSAGES=500
    volumes:
      - maildata:/data

  # ----------------------------------------------------------------------------
  # 5. LiveKit SFU - Selective Forwarding Unit for Real-Time Audio & Video
  # ----------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    container_name: watchparty-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"   # HTTP / WebSocket signaling
      - "7881:7881"   # TCP fallback for WebRTC
      - "50000-50020:50000-50020/udp" # WebRTC media UDP range for local testing
    environment:
      - LIVEKIT_KEYS=devkey: secret
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7880/ || exit 0"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # 6. Coturn - TURN/STUN Server Fallback for Strict NATs & Mobile Carriers
  # ----------------------------------------------------------------------------
  coturn:
    image: coturn/coturn:latest
    container_name: watchparty-coturn
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --use-auth-secret
      - --static-auth-secret=watchparty_coturn_secret
      - --realm=watchparty.local
      - --no-cli
    ports:
      - "3478:3478"
      - "3478:3478/udp"

volumes:
  appdata:
    driver: local
  pgdata:
    driver: local
  redisdata:
    driver: local
  maildata:
    driver: local
