name: AWS Deploy & Rollback Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform: 'deploy' (default) or 'rollback'"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
      rollback_tag:
        description: "Target image tag or SHA for rollback (leave empty to rollback to previous release)"
        required: false
        type: string

concurrency:
  group: aws-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 1. QUALITY GATE: FULL MONOREPO TEST SUITE (526 Tests)
  # ============================================================================
  quality-gate:
    name: Full Test Suite Verification
    runs-on: ubuntu-latest
    if: github.event.inputs.action != 'rollback'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Monorepo compilation & typecheck
        run: npm run build

      - name: Run all workspace tests (526 tests)
        run: npm test

  # ============================================================================
  # 2. DOCKER BUILD FOR ARM64 (AWS Graviton2 t4g.small) & PUSH
  # ============================================================================
  build-and-push:
    name: Build & Push ARM64 Container
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event.inputs.action != 'rollback'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      full_image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. DEPLOY OVER AWS SSM SESSION MANAGER (ZERO OPEN SSH PORTS) OR SSH
  # ============================================================================
  deploy-to-aws:
    name: Deploy to EC2 t4g.small
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || github.event.inputs.action == 'rollback')
    steps:
      - name: Configure AWS Credentials (for SSM Deployments)
        if: env.HAS_AWS_CREDENTIALS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        env:
          HAS_AWS_CREDENTIALS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      # ------------------------------------------------------------------------
      # DEPLOY VIA AWS SSM (RECOMMENDED - ZERO OPEN PORTS)
      # ------------------------------------------------------------------------
      - name: Execute Deployment via AWS SSM Session Manager
        if: env.HAS_SSM == 'true' && github.event.inputs.action != 'rollback'
        env:
          HAS_SSM: ${{ secrets.AWS_EC2_INSTANCE_ID != '' && secrets.AWS_ACCESS_KEY_ID != '' }}
          TARGET_IMAGE: ${{ needs.build-and-push.outputs.full_image }}
        run: |
          echo "Dispatching deployment command to EC2 instance ${{ secrets.AWS_EC2_INSTANCE_ID }} via AWS SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -eo pipefail\",
              \"cd /opt/watchparty\",
              \"echo 'Recording current image for 1-command rollback...'\",
              \"CURRENT_IMG=\\$(docker compose -f docker-compose.prod.yml images app --format '{{.Repository}}:{{.Tag}}' || true)\",
              \"echo \\\"\\$CURRENT_IMG\\\" > .last_deployed_tag\",
              \"echo 'Pulling new image: ${{ env.TARGET_IMAGE }}'\",
              \"export APP_IMAGE='${{ env.TARGET_IMAGE }}'\",
              \"docker compose -f docker-compose.prod.yml pull app\",
              \"echo 'Restarting app container...'\",
              \"docker compose -f docker-compose.prod.yml up -d --no-deps app\",
              \"echo 'Waiting for health probe...'\",
              \"for i in {1..15}; do if curl -sf http://localhost:3001/health | grep -q 'healthy'; then echo '✓ Deployment healthy!'; exit 0; fi; sleep 2; done\",
              \"echo 'Deployment failed healthcheck! Rolling back...'\",
              \"./scripts/rollback.sh\",
              \"exit 1\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent (ID: $COMMAND_ID). Awaiting status..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}"
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" --query "Status" --output text)
          if [ "$STATUS" != "Success" ]; then
            echo "SSM Deployment failed with status: $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" --query "StandardErrorContent" --output text
            exit 1
          fi
          echo "✓ EC2 SSM deployment verified successfully!"

      # ------------------------------------------------------------------------
      # ONE-COMMAND INSTANT ROLLBACK VIA AWS SSM
      # ------------------------------------------------------------------------
      - name: Execute Rollback via AWS SSM
        if: env.HAS_SSM == 'true' && github.event.inputs.action == 'rollback'
        env:
          HAS_SSM: ${{ secrets.AWS_EC2_INSTANCE_ID != '' && secrets.AWS_ACCESS_KEY_ID != '' }}
          ROLLBACK_TARGET: ${{ github.event.inputs.rollback_tag }}
        run: |
          echo "Executing instant rollback via AWS SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -eo pipefail\",
              \"cd /opt/watchparty\",
              \"./scripts/rollback.sh '${{ env.ROLLBACK_TARGET }}'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}"
          echo "✓ Rollback executed and verified!"

      # ------------------------------------------------------------------------
      # FALLBACK: DEPLOY VIA SSH (IF SSM SECRETS ARE NOT CONFIGURED)
      # ------------------------------------------------------------------------
      - name: Fallback Deploy via SSH
        if: env.HAS_SSH == 'true' && env.HAS_SSM != 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          HAS_SSH: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_SSH_KEY != '' }}
          HAS_SSM: ${{ secrets.AWS_EC2_INSTANCE_ID != '' && secrets.AWS_ACCESS_KEY_ID != '' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -eo pipefail
            cd /opt/watchparty
            if [ "${{ github.event.inputs.action }}" == "rollback" ]; then
              ./scripts/rollback.sh "${{ github.event.inputs.rollback_tag }}"
            else
              CURRENT_IMG=$(docker compose -f docker-compose.prod.yml images app --format '{{.Repository}}:{{.Tag}}' || true)
              echo "$CURRENT_IMG" > .last_deployed_tag
              export APP_IMAGE="${{ needs.build-and-push.outputs.full_image }}"
              docker compose -f docker-compose.prod.yml pull app
              docker compose -f docker-compose.prod.yml up -d --no-deps app
              for i in {1..15}; do
                if curl -sf http://localhost:3001/health | grep -q 'healthy'; then
                  echo "✓ Deployment healthy!"
                  exit 0
                fi
                sleep 2
              done
              echo "Deployment failed! Rolling back..."
              ./scripts/rollback.sh
              exit 1
            fi
