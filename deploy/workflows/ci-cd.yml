name: CI/CD Pipeline & Automated Deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 1. QUALITY GATE: LINT, MONOREPO TYPECHECK & FULL TEST SUITE (437+ Tests)
  # ============================================================================
  quality-gate:
    name: Lint, Typecheck & Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build monorepo packages (Strict Typecheck)
        run: npm run typecheck

      - name: Run all workspace tests (Shared, Server, Client, Extension)
        run: npm test

  # ============================================================================
  # 2. DOCKER BUILD & PUSH TO GITHUB CONTAINER REGISTRY (GHCR)
  # ============================================================================
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. ZERO-SURPRISE ZERO-DOWNTIME DEPLOYMENT
  # ============================================================================
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy via SSH to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true # Allows CI to succeed even before user configures VPS SSH secrets
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -eo pipefail
            cd /opt/watchparty

            echo "Saving current running tag for 1-command instant rollback..."
            CURRENT_IMAGE=$(docker compose -f docker-compose.prod.yml images app --format '{{.Repository}}:{{.Tag}}' || true)
            echo "$CURRENT_IMAGE" > .last_deployed_tag

            echo "Pulling new image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}..."
            export APP_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
            docker compose -f docker-compose.prod.yml pull app

            echo "Deploying new app container (graceful shutdown drains connections)..."
            docker compose -f docker-compose.prod.yml up -d --no-deps app

            echo "Verifying health probe..."
            for i in {1..15}; do
              if curl -s http://localhost:3001/health | grep -q '"status":"healthy"'; then
                echo "✓ Production deployment healthy and verified!"
                exit 0
              fi
              sleep 2
            done

            echo "Deployment failed health check! Triggering automated rollback to previous image..."
            ./scripts/rollback.sh
            exit 1
