services:
  - type: web
    name: watchparty-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:shared && npm run build:server
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: REGISTRATION_MODE
        value: public
      - key: CORS_ORIGIN
        value: "*"
