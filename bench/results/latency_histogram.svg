  <!-- SLA Threshold Line (250 ms) -->
  <line x1="720" y1="50" x2="720" y2="400" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4"/>
  <rect x="660" y="35" width="120" height="20" fill="#7f1d1d" rx="4" stroke="#ef4444" stroke-width="1"/>
  <text x="720" y="49" fill="#fecaca" font-size="10" font-weight="700" text-anchor="middle">SLA TARGET: 250ms</text>

  <!-- Percentile Markers -->
  <!-- p50 -->
  <line x1="83.364" y1="60" x2="83.364" y2="400" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="83.364" y="75" fill="#c084fc" font-size="10" font-weight="700" text-anchor="middle">p50: 5.14ms</text>

  <!-- p95 -->
  <line x1="200" y1="60" x2="200" y2="400" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="90" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">p95: 50ms</text>

  <!-- Summary Box -->
  <rect x="630" y="70" width="210" height="105" fill="#1e293b" rx="6" stroke="#334155" stroke-width="1"/>
  <text x="645" y="90" fill="#e2e8f0" font-size="11" font-weight="700">Summary Statistics (N=327)</text>
  <text x="645" y="108" fill="#94a3b8" font-size="10">p50: <tspan fill="#f1f5f9" font-weight="600">5.14 ms</tspan> | p90: <tspan fill="#f1f5f9" font-weight="600">25.42 ms</tspan></text>
  <text x="645" y="126" fill="#94a3b8" font-size="10">p95: <tspan fill="#f1f5f9" font-weight="600">50 ms</tspan> | p99: <tspan fill="#f1f5f9" font-weight="600">138.99 ms</tspan></text>
  <text x="645" y="144" fill="#94a3b8" font-size="10">Mean: <tspan fill="#f1f5f9" font-weight="600">13.17 ms</tspan> | Max: <tspan fill="#f1f5f9" font-weight="600">199.18 ms</tspan></text>
  <text x="645" y="162" fill="#94a3b8" font-size="10">Pass SLA: <tspan fill="#4ade80" font-weight="700">YES</tspan></text>
