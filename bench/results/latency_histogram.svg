    <rect x="344" y="398.78136200716847" width="37" height="1.2186379928315318" fill="url(#barGradient)" stroke="#38bdf8" stroke-width="1" rx="2" filter="url(#shadow)">
      <title>105-120 ms: 1 samples (0.3%)</title>
