    </rect>

  <!-- X-Axis Tick Marks -->
  
    <line x1="70" y1="400" x2="70" y2="406" stroke="#64748b" stroke-width="1.5"/>
    <text x="70" y="420" fill="#94a3b8" font-size="11" text-anchor="middle">0ms</text>
    <line x1="200" y1="400" x2="200" y2="406" stroke="#64748b" stroke-width="1.5"/>
    <text x="200" y="420" fill="#94a3b8" font-size="11" text-anchor="middle">50ms</text>
    <line x1="330" y1="400" x2="330" y2="406" stroke="#64748b" stroke-width="1.5"/>
    <text x="330" y="420" fill="#94a3b8" font-size="11" text-anchor="middle">100ms</text>
    <line x1="460" y1="400" x2="460" y2="406" stroke="#64748b" stroke-width="1.5"/>
    <text x="460" y="420" fill="#94a3b8" font-size="11" text-anchor="middle">150ms</text>
    <line x1="590" y1="400" x2="590" y2="406" stroke="#64748b" stroke-width="1.5"/>
    <text x="590" y="420" fill="#94a3b8" font-size="11" text-anchor="middle">200ms</text>
    <line x1="720" y1="400" x2="720" y2="406" stroke="#64748b" stroke-width="1.5"/>
    <text x="720" y="420" fill="#94a3b8" font-size="11" text-anchor="middle">250ms</text>
