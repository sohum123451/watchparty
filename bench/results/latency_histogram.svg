<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="barGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="exceedGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title & Status -->
  <text x="70" y="35" fill="#f8fafc" font-size="18" font-weight="700">Control Propagation Latency Distribution</text>
  <text x="850" y="35" text-anchor="end" fill="#4ade80" font-size="14" font-weight="700">
    STATUS: PASS (p95 ≤ 250ms)
  </text>

  <!-- Grid lines (horizontal) -->
  
    <line x1="70" y1="400" x2="850" y2="400" stroke="#334155" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="60" y="404" fill="#94a3b8" font-size="11" text-anchor="end">0</text>
    <line x1="70" y1="315" x2="850" y2="315" stroke="#334155" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="60" y="319" fill="#94a3b8" font-size="11" text-anchor="end">70</text>
    <line x1="70" y1="230" x2="850" y2="230" stroke="#334155" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="60" y="234" fill="#94a3b8" font-size="11" text-anchor="end">140</text>
    <line x1="70" y1="145" x2="850" y2="145" stroke="#334155" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="60" y="149" fill="#94a3b8" font-size="11" text-anchor="end">209</text>
    <line x1="70" y1="60" x2="850" y2="60" stroke="#334155" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="60" y="64" fill="#94a3b8" font-size="11" text-anchor="end">279</text>

  <!-- Axes -->
  <line x1="70" y1="400" x2="850" y2="400" stroke="#64748b" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="400" stroke="#64748b" stroke-width="1.5"/>

  <!-- Axis Labels -->
  <text x="460" y="460" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Latency (milliseconds)</text>
  <text x="25" y="230" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle" transform="rotate(-90, 25, 230)">Sample Count</text>

  <!-- Bars -->
  
    <rect x="71" y="60" width="37" height="340" fill="url(#barGradient)" stroke="#38bdf8" stroke-width="1" rx="2" filter="url(#shadow)">
