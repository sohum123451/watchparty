<!doctype html>

<div style="display:flex;justify-content:space-between;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:12px"><span>04:12</span><span style="color:#A89B8C">09:56</span></div>
</div>

<div style="display:flex;align-items:flex-end;gap:18px">
